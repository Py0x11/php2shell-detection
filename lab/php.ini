; Deliberately mirrors a "default-ish" deployment that is exploitable.
; The patched container uses the SAME config so version is the only difference.
memory_limit = 16M
post_max_size = 64M
max_file_uploads = 20
file_uploads = On
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
session.upload_progress.enabled = On
session.upload_progress.cleanup = On
opcache.enable = 0
expose_php = On
